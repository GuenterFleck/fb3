<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FB3 Quiz</title>
<style>
:root {
    --bg: #1a1a2e;
    --card: #16213e;
    --accent: #0f3460;
    --highlight: #e94560;
    --text: #eee;
    --correct: #2ecc71;
    --wrong: #e74c3c;
    --muted: #888;
    --border: #333;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
.container { max-width: 800px; margin: 0 auto; padding: 20px; }
h1 { text-align: center; margin-bottom: 24px; color: var(--highlight); font-size: 1.8rem; }
h2 { margin-bottom: 16px; font-size: 1.2rem; color: var(--muted); }

/* Menu */
.menu { display: flex; flex-direction: column; gap: 12px; }
.menu-btn {
    background: var(--accent); color: var(--text); border: none; padding: 16px 20px;
    border-radius: 10px; font-size: 1rem; cursor: pointer; text-align: left;
    transition: background .2s, transform .1s;
}
.menu-btn:hover { background: var(--highlight); transform: translateX(4px); }
.menu-btn .badge {
    float: right; background: var(--highlight); padding: 2px 10px; border-radius: 12px; font-size: .85rem;
}
.menu-btn:hover .badge { background: var(--accent); }

/* Category list */
.cat-list { display: flex; flex-direction: column; gap: 8px; }
.cat-btn {
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    padding: 14px 16px; border-radius: 8px; cursor: pointer; font-size: .95rem;
    display: flex; justify-content: space-between; align-items: center;
    transition: background .2s;
}
.cat-btn:hover { background: var(--accent); }
.cat-btn .info { color: var(--muted); font-size: .85rem; }

/* Quiz */
.question-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.progress { color: var(--muted); font-size: .9rem; }
.question-text { font-size: 1.15rem; margin-bottom: 20px; line-height: 1.5; }
.answers { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
.answer-btn {
    background: var(--card); border: 2px solid var(--border); color: var(--text);
    padding: 14px 16px; border-radius: 8px; cursor: pointer; font-size: .95rem;
    text-align: left; transition: border-color .2s, background .2s;
}
.answer-btn:hover:not(.disabled) { border-color: var(--highlight); }
.answer-btn.selected { border-color: var(--highlight); background: rgba(233,69,96,.15); }
.answer-btn.disabled { cursor: default; }
.answer-btn.show-correct { border-color: var(--correct); background: rgba(46,204,113,.15); }
.answer-btn.show-wrong { border-color: var(--wrong); background: rgba(231,76,60,.15); }

.btn-row { display: flex; gap: 12px; flex-wrap: wrap; }
.btn {
    background: var(--accent); color: var(--text); border: none; padding: 12px 24px;
    border-radius: 8px; font-size: .95rem; cursor: pointer; transition: background .2s;
}
.btn:hover { background: var(--highlight); }
.btn:disabled { opacity: .4; cursor: default; }
.btn-back { background: transparent; border: 1px solid var(--border); }
.btn-back:hover { background: var(--card); }

/* Result banner */
.result-banner {
    padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; font-weight: 600; font-size: 1rem;
}
.result-banner.correct { background: rgba(46,204,113,.2); color: var(--correct); }
.result-banner.wrong { background: rgba(231,76,60,.2); color: var(--wrong); }

/* Score summary */
.score-card {
    background: var(--card); border-radius: 10px; padding: 20px; margin-bottom: 20px;
    text-align: center;
}
.score-card .big { font-size: 2.5rem; font-weight: 700; }
.score-card .label { color: var(--muted); margin-top: 4px; }
.score-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-top: 16px; }
.score-grid .stat { text-align: center; }
.score-grid .stat .num { font-size: 1.4rem; font-weight: 600; }
.score-grid .stat .lbl { color: var(--muted); font-size: .85rem; }

/* Responsive */
@media (max-width: 500px) {
    .container { padding: 12px; }
    h1 { font-size: 1.4rem; }
    .question-text { font-size: 1rem; }
}
</style>
</head>
<body>
<div class="container" id="app"></div>

<script>
const STORAGE_KEY = 'fb3quiz_state';
let quizData = [];
let state = loadState();

function loadState() {
    try {
        const s = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (s && s.correct && s.wrong) return s;
    } catch {}
    return { correct: {}, wrong: {} }; // keyed by unique question key
}
function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function qkey(q) { return q.category + '|' + q.id; }

function getCategories() {
    const map = {};
    quizData.forEach(q => {
        if (!map[q.category]) map[q.category] = [];
        map[q.category].push(q);
    });
    return map;
}

function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

function getWrongQuestions(category) {
    return quizData.filter(q => {
        const k = qkey(q);
        if (category && q.category !== category) return false;
        return !!state.wrong[k];
    });
}

const app = document.getElementById('app');
function render(html) { app.innerHTML = html; }

// ── MAIN MENU ──
function showMenu() {
    const cats = getCategories();
    const totalQ = quizData.length;
    const wrongAll = getWrongQuestions().length;
    const correctAll = Object.keys(state.correct).length;

    render(`
        <h1>⚓ FB3 Quiz</h1>
        <div style="text-align:center;margin-bottom:20px;color:var(--muted)">
            ${totalQ} Fragen · ${correctAll} richtig · ${wrongAll} falsch
        </div>
        <div class="menu">
            <button class="menu-btn" onclick="showCategorySelect()">📂 Kategorie wählen</button>
            <button class="menu-btn" onclick="startRandom()">🎲 Zufällige Fragen <span class="badge">${totalQ}</span></button>
            <button class="menu-btn" onclick="showWrongByCategory()">📋 Falsche nach Kategorie</button>
            <button class="menu-btn" onclick="startWrongAll()">❌ Alle falschen Fragen <span class="badge">${wrongAll}</span></button>
            <button class="menu-btn btn-back" onclick="resetProgress()" style="margin-top:20px;font-size:.85rem;text-align:center">🗑️ Fortschritt zurücksetzen</button>
        </div>
        <div style="text-align:center;margin-top:24px;display:flex;flex-direction:column;gap:8px">
            <a href="oesv_fragensammlung_fb3_1_0.pdf" target="_blank" style="color:var(--muted);font-size:.85rem;text-decoration:none">📄 OESV Fragensammlung FB3 (PDF)</a>
            <a href="https://www.segelverband.at/ausbildung/seefahrt/vor-der-pruefung/#c3416" target="_blank" style="color:var(--muted);font-size:.85rem;text-decoration:none">🌐 OESV – Vor der Prüfung</a>
        </div>
    `);
}

function resetProgress() {
    if (confirm('Gesamten Fortschritt löschen?')) {
        state = { correct: {}, wrong: {} };
        saveState();
        showMenu();
    }
}

// ── CATEGORY SELECT ──
function showCategorySelect() {
    const cats = getCategories();
    const names = Object.keys(cats).sort();
    let html = '<h1>⚓ FB3 Quiz</h1><h2>Kategorie wählen</h2><div class="cat-list">';
    names.forEach(name => {
        const qs = cats[name];
        const wrong = qs.filter(q => state.wrong[qkey(q)]).length;
        const correct = qs.filter(q => state.correct[qkey(q)]).length;
        const label = name.replace(/^\d+_/, '').replace(/_/g, ' ');
        html += `<button class="cat-btn" onclick="startCategory('${name}')">
            <span>${label}</span>
            <span class="info">${qs.length} Fragen · ✓${correct} · ✗${wrong}</span>
        </button>`;
    });
    html += '</div><br><button class="btn btn-back" onclick="showMenu()">← Zurück</button>';
    render(html);
}

// ── WRONG BY CATEGORY ──
function showWrongByCategory() {
    const cats = getCategories();
    const names = Object.keys(cats).sort();
    let html = '<h1>⚓ FB3 Quiz</h1><h2>Falsche Fragen nach Kategorie</h2><div class="cat-list">';
    let any = false;
    names.forEach(name => {
        const wrong = getWrongQuestions(name);
        if (wrong.length === 0) return;
        any = true;
        const label = name.replace(/^\d+_/, '').replace(/_/g, ' ');
        html += `<button class="cat-btn" onclick="startWrongCategory('${name}')">
            <span>${label}</span>
            <span class="info">${wrong.length} falsche</span>
        </button>`;
    });
    if (!any) html += '<p style="color:var(--muted);padding:20px">Keine falschen Fragen vorhanden! 🎉</p>';
    html += '</div><br><button class="btn btn-back" onclick="showMenu()">← Zurück</button>';
    render(html);
}

// ── START MODES ──
function startCategory(cat) {
    const cats = getCategories();
    runQuiz(cats[cat], cat.replace(/^\d+_/, '').replace(/_/g, ' '));
}
function startRandom() { runQuiz(shuffle(quizData), 'Zufällige Fragen'); }
function startWrongAll() {
    const qs = getWrongQuestions();
    if (qs.length === 0) { alert('Keine falschen Fragen vorhanden!'); return; }
    runQuiz(shuffle(qs), 'Alle falschen Fragen');
}
function startWrongCategory(cat) {
    const qs = getWrongQuestions(cat);
    if (qs.length === 0) { alert('Keine falschen Fragen!'); return; }
    runQuiz(shuffle(qs), 'Falsche: ' + cat.replace(/^\d+_/, '').replace(/_/g, ' '));
}

// ── QUIZ ENGINE ──
function runQuiz(questions, title) {
    let idx = 0;
    let selected = new Set();
    let answered = false;
    let sessionResults = []; // true/false per question

    function showQuestion() {
        selected = new Set();
        answered = false;
        const q = questions[idx];
        const correctCount = q.answers.filter(a => a.is_correct).length;
        const multiHint = correctCount > 1 ? `<span style="color:var(--highlight)">(${correctCount} richtige Antworten)</span>` : '';

        let html = `<h1>⚓ FB3 Quiz</h1>`;
        html += `<div class="question-header"><h2>${title}</h2><span class="progress">${idx+1} / ${questions.length}</span></div>`;
        html += `<div class="question-text">${q.question} ${multiHint}<span style="color:var(--muted);font-size:.8rem;margin-left:8px">#${q.id} · ${q.key}</span></div>`;
        html += `<div style="margin-bottom:16px;text-align:center"><img src="img/${q.key}.png" alt="" style="max-width:100%;border-radius:8px;display:none" onload="this.style.display='block'" onerror="this.parentElement.style.display='none'"></div>`;
        html += `<div class="answers" id="answers">`;
        q.answers.forEach((a, i) => {
            html += `<button class="answer-btn" id="ans${i}" onclick="toggleAnswer(${i})">${a.option}) ${a.text}</button>`;
        });
        html += `</div>`;
        html += `<div id="result"></div>`;
        html += `<div class="btn-row">
            <button class="btn" id="submitBtn" onclick="submitAnswer()">Prüfen</button>
            <button class="btn" id="nextBtn" style="display:none" onclick="nextQuestion()">Weiter →</button>
            <button class="btn btn-back" onclick="confirmQuit()">✕ Beenden</button>
        </div>`;
        render(html);
    }

    window.toggleAnswer = function(i) {
        if (answered) return;
        if (selected.has(i)) selected.delete(i); else selected.add(i);
        questions[idx].answers.forEach((_, j) => {
            document.getElementById('ans' + j).className = 'answer-btn' + (selected.has(j) ? ' selected' : '');
        });
    };

    window.submitAnswer = function() {
        if (selected.size === 0 || answered) return;
        answered = true;
        const q = questions[idx];
        const k = qkey(q);
        const correctSet = new Set(q.answers.map((a, i) => a.is_correct ? i : -1).filter(i => i >= 0));
        const isCorrect = selected.size === correctSet.size && [...selected].every(i => correctSet.has(i));

        if (isCorrect) {
            delete state.wrong[k];
            state.correct[k] = true;
        } else {
            delete state.correct[k];
            state.wrong[k] = true;
        }
        saveState();
        sessionResults.push(isCorrect);

        // Show feedback
        q.answers.forEach((a, i) => {
            const el = document.getElementById('ans' + i);
            el.classList.add('disabled');
            if (a.is_correct) el.classList.add('show-correct');
            else if (selected.has(i)) el.classList.add('show-wrong');
        });

        document.getElementById('result').innerHTML = isCorrect
            ? '<div class="result-banner correct">✓ Richtig!</div>'
            : '<div class="result-banner wrong">✗ Falsch!</div>';
        document.getElementById('submitBtn').style.display = 'none';
        document.getElementById('nextBtn').style.display = '';
    };

    window.nextQuestion = function() {
        idx++;
        if (idx >= questions.length) { showSummary(); return; }
        showQuestion();
    };

    window.confirmQuit = function () {
        if (sessionResults.length > 0) showSummary();
        else showMenu();
    };

    function showSummary() {
        const total = sessionResults.length;
        const correct = sessionResults.filter(r => r).length;
        const wrong = total - correct;
        const pct = total > 0 ? Math.round(correct / total * 100) : 0;
        const emoji = pct === 100 ? '🏆' : pct >= 70 ? '👍' : pct >= 50 ? '😐' : '💪';

        render(`
            <h1>⚓ FB3 Quiz</h1>
            <h2>${title} — Ergebnis</h2>
            <div class="score-card">
                <div class="big" style="color:${pct >= 70 ? 'var(--correct)' : pct >= 50 ? 'orange' : 'var(--wrong)'}">${pct}% ${emoji}</div>
                <div class="label">Richtig beantwortet</div>
                <div class="score-grid">
                    <div class="stat"><div class="num">${total}</div><div class="lbl">Fragen</div></div>
                    <div class="stat"><div class="num" style="color:var(--correct)">${correct}</div><div class="lbl">Richtig</div></div>
                    <div class="stat"><div class="num" style="color:var(--wrong)">${wrong}</div><div class="lbl">Falsch</div></div>
                </div>
            </div>
            <div class="btn-row">
                <button class="btn" onclick="showMenu()">← Hauptmenü</button>
            </div>
        `);
    }

    showQuestion();
}
